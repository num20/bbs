# Helm チャートを oci://ghcr.io/<owner>/charts/bbs に公開する（Actions タブから手動で実行）
# バージョンは charts/bbs/Chart.yaml の version を使う。イメージのバージョン（appVersion）は入力で指定でき、空なら Chart.yaml の appVersion
# 先に appVersion と同じバージョンのイメージを publish-image で公開しておく（ないと失敗する）
# 初めて公開したパッケージは非公開になる。認証なしで取得できるようにするには、GitHub の Package settings → Change visibility で公開に変更する
# 公開したチャートには Cosign で keyless 署名する（GitHub Actions の OIDC トークンを使うため鍵は不要）
name: publish-chart

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: "イメージのバージョン（例: 0.1.0、edge）。空なら Chart.yaml の appVersion"
        required: false

permissions:
  contents: read
  packages: write
  # Cosign の keyless 署名に使う
  id-token: write

env:
  CHART_DIR: charts/bbs

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - uses: sigstore/cosign-installer@v4

      - name: ghcr.io にログイン
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: バージョンを確認
        env:
          INPUT_APP_VERSION: ${{ inputs.app-version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version=$(yq '.version' "$CHART_DIR/Chart.yaml")
          app_version="${INPUT_APP_VERSION:-$(yq '.appVersion' "$CHART_DIR/Chart.yaml")}"

          # 同じバージョンのチャートを上書きしない
          if helm show chart "oci://ghcr.io/$owner/charts/bbs" --version "$version" > /dev/null 2>&1; then
            echo "::error::チャート bbs:$version は公開済みです。Chart.yaml の version を上げてください"
            exit 1
          fi

          # appVersion のイメージが公開済みか
          docker buildx imagetools inspect "ghcr.io/$owner/bbs:$app_version" > /dev/null \
            || { echo "::error::イメージ ghcr.io/$owner/bbs:$app_version がありません。先に publish-image を実行してください"; exit 1; }

          echo "OWNER=$owner" >> "$GITHUB_ENV"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - run: helm lint "$CHART_DIR"

      - name: パッケージして公開
        run: |
          helm package "$CHART_DIR" --app-version "$APP_VERSION" --destination dist
          out=$(helm push dist/bbs-*.tgz "oci://ghcr.io/$OWNER/charts" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' <<< "$out" | head -n 1)
          [[ -n "$digest" ]] || { echo "::error::helm push の出力からダイジェストを取得できませんでした"; exit 1; }
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      # タグではなくダイジェストに署名する
      - name: Cosign で署名
        run: cosign sign --yes "ghcr.io/$OWNER/charts/bbs@$DIGEST"
