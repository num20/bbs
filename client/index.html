<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>掲示板</title>
    <script>
      // 描画前にテーマを適用してちらつきを防ぐ
      (() => {
        const a = localStorage.getItem('bbs:appearance') ?? 'auto';
        const dark = a === 'dark' || (a === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
