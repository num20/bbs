{{- if include "bbs.createSecret" . }}
{{- $fullname := include "bbs.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "bbs.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.bbs.existingSecret }}
  {{- /* ソルトが変わると ID とトリップが変わるため、未指定なら既存の値を引き継ぐ */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
  {{- if .Values.bbs.salt }}
  BBS_SALT: {{ .Values.bbs.salt | b64enc | quote }}
  {{- else if and $existing $existing.data (hasKey $existing.data "BBS_SALT") }}
  BBS_SALT: {{ index $existing.data "BBS_SALT" | quote }}
  {{- else }}
  BBS_SALT: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.litestream.s3 }}
  {{- if and $.Values.litestream.enabled .accessKeyId (not .existingSecret) }}
  LITESTREAM_ACCESS_KEY_ID: {{ .accessKeyId | b64enc | quote }}
  LITESTREAM_SECRET_ACCESS_KEY: {{ required "litestream.s3.secretAccessKey を指定してください" .secretAccessKey | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
